services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tasklist
      POSTGRES_PASSWORD: tasklist
      POSTGRES_DB: tasklist
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasklist -d tasklist"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tasklist:tasklist@db:5432/tasklist
      NODE_ENV: development
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npx tsx src/main.ts"

volumes:
  db-data: